@if (viewConfig) {
    <div id="config-modal"
         class="modal is-active">
        <div id="close-config"
             class="modal-background"
             (click)="closeConfig()"></div>
        <div class="modal-card">
            <header class="modal-card-head is-primary">
                <p class="modal-card-title"
                   i18n>Rules configuration</p>
                <button class="delete"
                        aria-label="close"
                        (click)="closeConfig()"></button>
            </header>
            <section class="modal-card-body">
                <app-rules-configuration id="rules-config-component"
                                         [rulesConfigDescription]="rulesConfigDescription()"
                                         [creatorMode]="false"
                                         [rulesConfigToDisplay]="rulesConfig()"
                                         [editable]="false">
                </app-rules-configuration>
            </section>
        </div>
    </div>
}
<p class="title">
    {{ gameName() }}
    @if (rulesConfigDescription().isCustomizable()) {
        <a id="show-config"
           (click)="openConfig()"
           class="primary-fg"
           i18n-data-tooltip
           data-tooltip="View configuration"><fa-icon [icon]="faCog"></fa-icon></a>
    }
</p>
